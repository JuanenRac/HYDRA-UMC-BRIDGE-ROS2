<title id="t">HYDRA-UMC-BRIDGE-ROS2 architecture</title>
<desc id="d">HYDRA-UMC-BRIDGE-ROS2 maps a correlated cell job onto the kind of ROS 2 interface it needs, with a name that must start with /hydra_umc/, asks the shared evaluate_job gate of HYDRA-UMC-SDK and reaches ROS 2 through two standard-typed rclpy interfaces: a state subscriber and a safe-stop service client. MQTT carries the commands and the answers.</desc>
